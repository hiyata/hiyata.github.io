  .nbme-legend-dot.answered{ background: var(--nbme-accent); }
  .nbme-legend-dot.unanswered{ background: var(--nbme-page); border:1px solid var(--nbme-border); }
  .nbme-legend-dot.marked{ background: var(--nbme-amber); }

  .nbme-nav-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap:0.5rem; margin-bottom:1rem; }
  @media (max-width:480px){ .nbme-nav-grid{ grid-template-columns: repeat(5,1fr); } }
  .nbme-nav-cell{
    position:relative; aspect-ratio:1; border-radius:3px; border:1px solid var(--nbme-border);
    background: var(--nbme-card); color: var(--nbme-ink); font-weight:700; font-size:0.85rem;
    font-family: var(--nbme-sans); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .nbme-nav-cell:hover{ border-color: var(--nbme-accent); }
  .nbme-nav-cell.answered{ background: var(--nbme-accent); border-color: var(--nbme-accent); color:#fff; }
  .nbme-nav-cell.current{ outline: 2px solid var(--nbme-navy); outline-offset:2px; }
  .nbme-nav-cell .flagdot{
    position:absolute; top:-4px; right:-4px; width:10px; height:10px; border-radius:50%;
    background: var(--nbme-amber); border:1.5px solid var(--nbme-card);
  }
  .nbme-nav-footer{
    display:flex; align-items:center; justify-content:space-between; gap:0.75rem; flex-wrap:wrap;
    font-size:0.8rem; color: var(--nbme-muted); border-top:1px solid var(--nbme-border); padding-top:0.85rem;
  }

  /* ---------- Lightbox ---------- */
  .nbme-lightbox{
    position: fixed; inset:0; background: rgba(0,0,0,0.85); display:none;
    align-items:center; justify-content:center; z-index:9999; padding:2rem; cursor:zoom-out;
  }
  .nbme-lightbox.open{ display:flex; }
  .nbme-lightbox img{ max-width:100%; max-height:100%; border-radius: 2px; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- Text highlighting (select-to-highlight in the stem) ---------- */
  .nbme-stem{ user-select:text; }
  .nbme-app mark.nbme-hl{
    background:#ffe066; color:#141414; padding:0 1px; border-radius:1px;
    cursor:pointer; text-decoration:none;
  }
</style>

<!--
  The highlight "apply" toolbar is appended to document.body (not #nbme-app),
  so it can float above the page while a text selection is active — it needs
  its own fixed, theme-independent styling to match the rest of this page.
-->
<style>
  #nbme-hl-toolbar{
    position: fixed; display:none; z-index:10000;
    background:#1c3f6e; border:1px solid #1c3f6e; border-radius:3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  #nbme-hl-toolbar button{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight:700; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.03em;
    background: transparent; color:#fff; border:none; padding:0.45rem 0.8rem; cursor:pointer;
  }
  #nbme-hl-toolbar button:hover{ background: rgba(255,255,255,0.15); }
</style>

<script>
(function(){
  var SITE_ROOT = '{{ "/" | relative_url }}';
  var BACK_LINK_HTML = '<a href="' + SITE_ROOT + '" class="nbme-back-link">&larr; Back to Site</a>';
  var DATA = window.NBME_GI_PATH_DATA;
  var root = document.getElementById('nbme-app');
  if (!DATA || !root) return;

  var IMAGE_BASE = root.getAttribute('data-image-base') || DATA.imageBase || '/assets/images/nbme/gi-path/';
  var STORAGE_KEY = 'nbmeGiPathStatsV1';
  var ALL_QUESTIONS = DATA.questions || [];
  var TAGS = [];
  (function(){
    var seen = {};
    ALL_QUESTIONS.forEach(function(q){
      if(!seen[q.tag]){ seen[q.tag] = 0; TAGS.push(q.tag); }
      seen[q.tag]++;
    });
    TAGS.sort();
    window.__nbmeTagCounts = seen;
  })();

  // ---------------- persistent stats ----------------
  function loadStats(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { perTag:{}, history:[] };
      var parsed = JSON.parse(raw);
      if(!parsed.perTag) parsed.perTag = {};
      if(!parsed.history) parsed.history = [];
      return parsed;
    }catch(e){ return { perTag:{}, history:[] }; }
  }
  function saveStats(stats){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }catch(e){}
  }
  function recordAnswer(stats, tag, correct){
    if(!stats.perTag[tag]) stats.perTag[tag] = { correct:0, total:0 };
    stats.perTag[tag].total++;
    if(correct) stats.perTag[tag].correct++;
  }
  function recordAttempt(stats, correctCount, total){
    stats.history.unshift({ date: new Date().toISOString(), correct: correctCount, total: total });
    stats.history = stats.history.slice(0, 20);
  }

  var stats = loadStats();

  // ---------------- state ----------------
  var state = {
    screen: 'setup', // setup | quiz | results
    selectedTags: {},
    difficultyFilter: { normal: true, hard: true },
    shuffleQuestions: true,
    shuffleChoices: true,
    countMode: 'all',
    block: [],       // array of { source, displayOrder, userChoice, submitted, marked } for this run
    index: 0,
    navigatorOpen: false,
    timerSeconds: 0,
    timerHidden: false,
    timerPaused: false
  };
  TAGS.forEach(function(t){ state.selectedTags[t] = true; });

  var timerIntervalId = null;
  function formatTime(sec){
    sec = Math.max(0, sec|0);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function stopTimer(){
    if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
  }
  function startTimer(totalSeconds){
    stopTimer();
    state.timerSeconds = totalSeconds;
    state.timerPaused = false;
    timerIntervalId = setInterval(function(){
      if(state.timerPaused) return;
      state.timerSeconds = Math.max(0, state.timerSeconds - 1);
      updateTimerDisplay();
    }, 1000);
  }
  function updateTimerDisplay(){
    var el = document.getElementById('nbme-timer-value');
    if(!el) return;
    el.textContent = formatTime(state.timerSeconds);
    el.classList.toggle('low', state.timerSeconds <= 300);
  }
  function displayLetterOf(item, originalLetter){
    var idx = item.displayOrder.indexOf(originalLetter);
    return String.fromCharCode(65 + (idx < 0 ? 0 : idx));
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function pctClass(pct){
    if(pct >= 80) return 'good';
    if(pct >= 60) return 'mid';
    return 'bad';
  }

  // ---------------- text highlighting (select-to-highlight in the stem) ----------------
  function normalizeRanges(ranges){
    var sorted = ranges.slice().sort(function(a,b){ return a.start - b.start; });
    var merged = [];
    sorted.forEach(function(r){
      if(merged.length && r.start <= merged[merged.length - 1].end){
        merged[merged.length - 1].end = Math.max(merged[merged.length - 1].end, r.end);
      } else {
        merged.push({ start: r.start, end: r.end });
      }
    });
    return merged;
  }
  function renderHighlightedHtml(text, ranges){
    if(!ranges || !ranges.length) return esc(text);
    var sorted = ranges.slice().sort(function(a,b){ return a.start - b.start; });
    var out = '', pos = 0;
    sorted.forEach(function(r, i){
      var start = Math.max(pos, Math.min(r.start, text.length));
      var end = Math.max(start, Math.min(r.end, text.length));
      if(start > pos) out += esc(text.slice(pos, start));
      if(end > start){
        out += '<mark class="nbme-hl" data-hl-idx="' + i + '">' + esc(text.slice(start, end)) + '</mark>';
      }
      pos = Math.max(pos, end);
    });
    if(pos < text.length) out += esc(text.slice(pos));
    return out;
  }
  function textOffsetIn(container, node, offset){
    var range = document.createRange();
    range.selectNodeContents(container);
    range.setEnd(node, offset);
    return range.toString().length;
  }

  var hlToolbar = null, pendingHighlight = null;
  function ensureHighlightToolbar(){
    if(hlToolbar) return hlToolbar;
    hlToolbar = document.createElement('div');
    hlToolbar.id = 'nbme-hl-toolbar';
    hlToolbar.innerHTML = '<button type="button" id="nbme-hl-apply">Highlight</button>';
    document.body.appendChild(hlToolbar);
    document.getElementById('nbme-hl-apply').addEventListener('click', function(){
      if(!pendingHighlight) return;
      var item = state.block[pendingHighlight.itemIndex];
      if(item){
        item.highlights = normalizeRanges((item.highlights || []).concat([{ start: pendingHighlight.start, end: pendingHighlight.end }]));
      }
      pendingHighlight = null;
      hideHighlightToolbar();
      var sel = window.getSelection();
      if(sel) sel.removeAllRanges();
      render();
    });
    document.addEventListener('mousedown', function(e){
      if(hlToolbar && !hlToolbar.contains(e.target)) hideHighlightToolbar();
    }, true);
    return hlToolbar;
  }
  function hideHighlightToolbar(){
    if(hlToolbar) hlToolbar.style.display = 'none';
    pendingHighlight = null;
  }
  function showHighlightToolbarFor(rect){
    var tb = ensureHighlightToolbar();
    tb.style.display = 'block';
    var left = rect.left + rect.width / 2;
    var top = rect.top - 40;
    tb.style.left = Math.max(8, Math.min(left, window.innerWidth - 100)) + 'px';
    tb.style.top = Math.max(8, top) + 'px';
  }
  function wireHighlightableStem(stemEl, itemIndex){
    stemEl.addEventListener('mouseup', function(){
      setTimeout(function(){
        var sel = window.getSelection();
        if(!sel || sel.isCollapsed || sel.rangeCount === 0){ return; }
        var range = sel.getRangeAt(0);
        if(!stemEl.contains(range.commonAncestorContainer)) return;
        var start = textOffsetIn(stemEl, range.startContainer, range.startOffset);
        var end = textOffsetIn(stemEl, range.endContainer, range.endOffset);
        if(start > end){ var t = start; start = end; end = t; }
        if(end <= start) return;
        pendingHighlight = { itemIndex: itemIndex, start: start, end: end };
        showHighlightToolbarFor(range.getBoundingClientRect());
      }, 0);
    });
    stemEl.querySelectorAll('.nbme-hl').forEach(function(m){
      m.addEventListener('click', function(e){
        e.stopPropagation();
        var idx = parseInt(m.getAttribute('data-hl-idx'), 10);
        var item = state.block[itemIndex];
        if(item && item.highlights){
          item.highlights.sort(function(a,b){ return a.start - b.start; });
          item.highlights.splice(idx, 1);
        }
        hideHighlightToolbar();
        render();
      });
    });
  }

  // ---------------- render dispatch ----------------
  function render(){
    if(state.screen === 'setup') renderSetup();
    else if(state.screen === 'quiz') renderQuiz();
    else renderResults();
  }

  function matchesFilters(q){
    return !!state.selectedTags[q.tag] && !!state.difficultyFilter[q.difficulty || 'normal'];
  }

  // ================= SETUP SCREEN =================
  function renderSetup(){
    var selectedCount = ALL_QUESTIONS.filter(matchesFilters).length;

    var statsHtml = '';
    var tagEntries = Object.keys(stats.perTag);
    if(tagEntries.length === 0){
      statsHtml = '<div class="nbme-stats-empty">No attempts yet — finish a block to start tracking your accuracy by topic.</div>';
    } else {
      var totalCorrect = 0, totalSeen = 0;
      tagEntries.forEach(function(t){ totalCorrect += stats.perTag[t].correct; totalSeen += stats.perTag[t].total; });
      var overallPct = totalSeen ? Math.round((totalCorrect/totalSeen)*100) : 0;

      var weakest = tagEntries
        .map(function(t){ return { tag:t, pct: stats.perTag[t].total ? (stats.perTag[t].correct/stats.perTag[t].total*100) : 0, total: stats.perTag[t].total }; })
        .filter(function(x){ return x.total >= 2; })
        .sort(function(a,b){ return a.pct - b.pct; })[0];

      var lastAttempt = stats.history[0];

      statsHtml =
        '<div class="nbme-stat"><div class="n">' + overallPct + '%</div><div class="l">Lifetime accuracy</div></div>' +
        '<div class="nbme-stat"><div class="n">' + totalSeen + '</div><div class="l">Questions answered</div></div>' +
        '<div class="nbme-stat"><div class="n">' + (lastAttempt ? lastAttempt.correct + '/' + lastAttempt.total : '—') + '</div><div class="l">Last block score</div></div>' +
        (weakest ? '<div class="nbme-stat weak"><div class="n">' + esc(weakest.tag) + '</div><div class="l">Weakest topic (' + Math.round(weakest.pct) + '%)</div></div>' : '<div class="nbme-stat"><div class="n">—</div><div class="l">Weakest topic</div></div>') +
        '<button class="nbme-reset-stats" id="nbme-reset-stats-btn" type="button">Reset all stats</button>';
    }

    var tagsHtml = TAGS.map(function(t){
      var count = ALL_QUESTIONS.filter(function(q){ return q.tag === t && state.difficultyFilter[q.difficulty || 'normal']; }).length;
      var checked = !!state.selectedTags[t];
      return (
        '<label class="nbme-tag-item' + (checked ? ' checked' : '') + '" data-tag="' + esc(t) + '">' +
          '<span class="left">' +
            '<input type="checkbox" ' + (checked ? 'checked' : '') + ' data-tag-checkbox="' + esc(t) + '" />' +
            '<span class="name">' + esc(t) + '</span>' +
          '</span>' +
          '<span class="count">' + count + '</span>' +
        '</label>'
      );
    }).join('');

    var maxAvailable = selectedCount;
    var countOptions = [10, 20, 30, 40].filter(function(n){ return n < maxAvailable; });
    var countSelectHtml = '<option value="all"' + (state.countMode === 'all' ? ' selected' : '') + '>All selected (' + maxAvailable + ')</option>' +
      countOptions.map(function(n){
        return '<option value="' + n + '"' + (String(state.countMode) === String(n) ? ' selected' : '') + '>' + n + ' questions</option>';
      }).join('');

    root.innerHTML =
      '<div class="nbme-shell">' +
        '<div class="nbme-topbar">' +
          '<div class="nbme-brand"><span class="dot"></span> ' + esc(DATA.setTitle || 'NBME-Style Practice') + '</div>' +
          '<div class="nbme-meta">Tutor Mode</div>' +
          '<div class="nbme-spacer"></div>' +
          BACK_LINK_HTML +
        '</div>' +
        '<div class="nbme-body">' +
          '<div class="nbme-setup-head">' +
            '<h1>' + esc(DATA.setTitle || 'Practice Exam') + '</h1>' +
            '<p>' + esc(DATA.setSubtitle || '') + '</p>' +
          '</div>' +

          '<div class="nbme-section-label">Your performance</div>' +
          '<div class="nbme-stats-panel">' + statsHtml + '</div>' +

          '<div class="nbme-section-label">Choose topics</div>' +
          '<div class="nbme-tag-toolbar">' +
            '<button type="button" id="nbme-tag-all">Select all</button>' +
            '<button type="button" id="nbme-tag-none">Clear all</button>' +
          '</div>' +
          '<div class="nbme-tag-grid">' + tagsHtml + '</div>' +

          '<div class="nbme-section-label">Difficulty</div>' +
          '<div class="nbme-options-row">' +
            '<label><input type="checkbox" id="nbme-diff-normal" ' + (state.difficultyFilter.normal ? 'checked' : '') + ' /> Normal</label>' +
            '<label><input type="checkbox" id="nbme-diff-hard" ' + (state.difficultyFilter.hard ? 'checked' : '') + ' /> Difficult</label>' +
          '</div>' +

          '<div class="nbme-section-label">Block options</div>' +
          '<div class="nbme-options-row">' +
            '<label>Question count ' +
              '<select id="nbme-count-select">' + countSelectHtml + '</select>' +
            '</label>' +
            '<label><input type="checkbox" id="nbme-shuffle-q" ' + (state.shuffleQuestions ? 'checked' : '') + ' /> Shuffle question order</label>' +
            '<label><input type="checkbox" id="nbme-shuffle-c" ' + (state.shuffleChoices ? 'checked' : '') + ' /> Shuffle answer choices</label>' +
          '</div>' +

          '<div class="nbme-start-row">' +
            '<button class="nbme-btn nbme-btn-primary" id="nbme-start-btn" ' + (selectedCount === 0 ? 'disabled' : '') + '>Start Block (' + Math.min(maxAvailable, (state.countMode === 'all' ? maxAvailable : parseInt(state.countMode,10))) + ' items)</button>' +
            '<span class="nbme-start-hint">' + selectedCount + ' question' + (selectedCount === 1 ? '' : 's') + ' available in selected topics</span>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('nbme-tag-all').addEventListener('click', function(){
      TAGS.forEach(function(t){ state.selectedTags[t] = true; });
      render();
    });
    document.getElementById('nbme-tag-none').addEventListener('click', function(){
      TAGS.forEach(function(t){ state.selectedTags[t] = false; });
      render();
    });
    root.querySelectorAll('[data-tag-checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var tag = cb.getAttribute('data-tag-checkbox');
        state.selectedTags[tag] = cb.checked;
        render();
      });
    });
    document.getElementById('nbme-count-select').addEventListener('change', function(e){
      state.countMode = e.target.value;
      render();
    });
    document.getElementById('nbme-diff-normal').addEventListener('change', function(e){
      state.difficultyFilter.normal = e.target.checked;
      render();
    });
    document.getElementById('nbme-diff-hard').addEventListener('change', function(e){
      state.difficultyFilter.hard = e.target.checked;
      render();
    });
    document.getElementById('nbme-shuffle-q').addEventListener('change', function(e){ state.shuffleQuestions = e.target.checked; });
    document.getElementById('nbme-shuffle-c').addEventListener('change', function(e){ state.shuffleChoices = e.target.checked; });

    var resetBtn = document.getElementById('nbme-reset-stats-btn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(confirm('Reset all saved stats for this quiz? This cannot be undone.')){
          stats = { perTag:{}, history:[] };
          saveStats(stats);
          render();
        }
      });
    }

    var startBtn = document.getElementById('nbme-start-btn');
    if(startBtn){
      startBtn.addEventListener('click', function(){ startBlock(); });
    }
  }

  function startBlock(fromIds){
    var pool;
    if(fromIds){
      pool = ALL_QUESTIONS.filter(function(q){ return fromIds.indexOf(q.id) !== -1; });
    } else {
      pool = ALL_QUESTIONS.filter(matchesFilters);
      if(state.shuffleQuestions) pool = shuffle(pool);
      if(state.countMode !== 'all'){
        pool = pool.slice(0, parseInt(state.countMode, 10));
      }
    }

    state.block = pool.map(function(q){
      var letters = Object.keys(q.options);
      var order = state.shuffleChoices ? shuffle(letters) : letters;
      return {
        source: q,
        displayOrder: order, // original letters, in the order they're displayed (A..E map to these positions)
        userChoice: null,    // original letter the user picked
        submitted: false,
        marked: false,
        struck: {},          // origLetter -> true, choices the user crossed out
        highlights: [],       // [{start,end}] character ranges highlighted in the stem
        startedAt: null,      // Date.now() when this item was first shown, for time-spent tracking
        timeSpentMs: 0
      };
    });
    state.index = 0;
    state.navigatorOpen = false;
    state.timerHidden = false;
    state.screen = 'quiz';
    startTimer(state.block.length * 90); // ~1.5 min/item, like a real block
    render();
  }

  // ================= QUIZ SCREEN =================
  function renderQuiz(){
    var total = state.block.length;
    if(total === 0){ state.screen = 'setup'; render(); return; }
    var item = state.block[state.index];
    var q = item.source;
    var pct = Math.round((state.index) / total * 100);
    if(!item.submitted && !item.startedAt) item.startedAt = Date.now();

    var imagesHtml = '';
    if(q.images && q.images.length){
      imagesHtml = '<div class="nbme-images">' + q.images.map(function(fn, i){
        var label = q.images.length > 1 ? (i === 0 ? 'Image (left)' : 'Image (right)') : 'Image';
        return '<figure><img src="' + IMAGE_BASE + fn + '" alt="Exhibit for question ' + q.id + '" data-lightbox-src="' + IMAGE_BASE + fn + '" />' +
          '<figcaption>' + label + '</figcaption></figure>';
      }).join('') + '</div>';
    }

    var choicesHtml = item.displayOrder.map(function(origLetter, idx){
      var displayLetter = String.fromCharCode(65 + idx); // always A, B, C, D, E in on-screen order
      var locked = item.submitted;
      var struck = !!item.struck[origLetter];
      var cls = 'nbme-choice';
      if(locked) cls += ' locked';
      if(struck) cls += ' struck';
      if(!locked && item.userChoice === origLetter) cls += ' selected';
      var check = '';
      if(locked){
        if(origLetter === q.answer){ cls += ' correct-answer'; check = '&#10003;'; }
        else if(origLetter === item.userChoice){ cls += ' wrong-answer'; check = '&#10007;'; }
      }
      var selectedNow = !locked && item.userChoice === origLetter;
      var strikeBtn = !locked
        ? '<button type="button" class="nbme-strike-btn' + (struck ? ' active' : '') + '" data-strike="' + origLetter + '" title="Cross out this choice">&#8856;</button>'
        : '';
      return (
        '<div class="' + cls + '" data-choice="' + origLetter + '">' +
          '<span class="check-slot">' + check + '</span>' +
          '<span class="nbme-radio' + (selectedNow ? ' filled' : '') + '"></span>' +
          '<span class="letter">' + displayLetter + '.</span>' +
          '<span class="choicetext">' + esc(q.options[origLetter]) + '</span>' +
          strikeBtn +
        '</div>'
      );
    }).join('');

    var statStripHtml = '';
    var explanationHtml;
    if(item.submitted){
      var correct = item.userChoice === q.answer;
      var tagStats = stats.perTag[q.tag];
      var tagPct = tagStats && tagStats.total ? Math.round((tagStats.correct / tagStats.total) * 100) : 0;
      var timeStr = formatTime(Math.round((item.timeSpentMs || 0) / 1000));

      statStripHtml =
        '<div class="nbme-stat-strip ' + (correct ? 'is-correct' : 'is-wrong') + '">' +
          '<span class="status-label">' + (correct ? '&#10003; Correct' : '&#10007; Incorrect') + '</span>' +
          '<div class="nbme-stat-chip"><b>' + tagPct + '%</b><span>Correct on this topic</span></div>' +
          '<div class="nbme-stat-chip"><b>' + timeStr.replace(/^00:/, '') + '</b><span>Time spent</span></div>' +
          '<div class="nbme-stat-chip"><b>' + esc(q.topic || q.tag) + '</b><span>Topic</span></div>' +
        '</div>';

      explanationHtml =
        '<div class="nbme-explanation-topic">Topic: ' + esc(q.topic || q.tag) + '</div>' +
        '<p class="nbme-explanation-text">' + esc(q.explanation) + '</p>';
    } else {
      explanationHtml = '<div class="nbme-explanation-placeholder">Submit an answer to see the explanation.</div>';
    }

    var submitRowHtml = !item.submitted
      ? '<div class="nbme-actions"><button class="nbme-btn nbme-btn-primary" id="nbme-submit-btn" ' + (item.userChoice ? '' : 'disabled') + '>Submit Answer</button></div>'
      : '';

    var answeredCount = state.block.filter(function(it){ return it.submitted; }).length;
    var correctSoFar = state.block.filter(function(it){ return it.submitted && it.userChoice === it.source.answer; }).length;
    var isLast = state.index === total - 1;

    root.innerHTML =
      '<div class="nbme-shell">' +
        '<div class="nbme-topbar">' +
          '<button class="nbme-icon-btn" id="nbme-navigator-btn" title="Question Navigator">&#9776;</button>' +
          '<div class="nbme-item-info">' +
            '<span class="l1">Item ' + (state.index + 1) + ' of ' + total + '</span>' +
            '<span class="l2">' + esc(q.tag) + (q.difficulty === 'hard' ? ' &middot; Difficult' : '') + '</span>' +
          '</div>' +
          '<button class="nbme-icon-btn flag' + (item.marked ? ' marked' : '') + '" id="nbme-mark-btn" title="Mark for Review">&#9873;</button>' +
          '<button class="nbme-icon-btn" id="nbme-prev-btn" title="Previous" ' + (state.index === 0 ? 'disabled' : '') + '>&#9664;</button>' +
          '<button class="nbme-icon-btn" id="nbme-bottom-next-btn" title="Next">&#9654;</button>' +
          '<div class="nbme-spacer"></div>' +
          '<span class="nbme-score-live">Score: ' + correctSoFar + ' / ' + answeredCount + '</span>' +
          BACK_LINK_HTML +
          '<button class="nbme-exit" id="nbme-exit-btn" type="button">End Block</button>' +
        '</div>' +
        '<div class="nbme-progress-track"><div class="nbme-progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="nbme-body is-quiz">' +
          '<div class="nbme-quiz-grid">' +
            '<div class="nbme-quiz-left">' +
              '<div class="nbme-stem" id="nbme-stem-el">' + renderHighlightedHtml(q.stem, item.highlights) + '</div>' +
              imagesHtml +
              '<div class="nbme-choices">' + choicesHtml + '</div>' +
              submitRowHtml +
              statStripHtml +
            '</div>' +
            '<div class="nbme-quiz-right">' +
              '<div class="nbme-explanation-tab">Explanation</div>' +
              explanationHtml +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="nbme-bottombar">' +
          '<div class="nbme-bb-left">' +
            '<span class="nbme-bb-timer-label">Block Time Remaining</span>' +
            '<div class="nbme-bb-timer-row">' +
              (state.timerHidden
                ? '<button class="nbme-timer-toggle" id="nbme-timer-toggle" type="button">Show Timer</button>'
                : ('<span class="nbme-timer' + (state.timerSeconds <= 300 ? ' low' : '') + '" id="nbme-timer-value">' + formatTime(state.timerSeconds) + '</span>' +
                   '<button class="nbme-timer-toggle" id="nbme-timer-toggle" type="button">Hide</button>')) +
            '</div>' +
          '</div>' +
          '<div class="nbme-bb-right">' +
            '<button class="nbme-icon-btn' + (item.marked ? ' flag marked' : ' flag') + '" id="nbme-bb-mark-btn" title="Mark for Review">&#9873;</button>' +
            '<button class="nbme-icon-btn" id="nbme-pause-btn" title="' + (state.timerPaused ? 'Resume timer' : 'Pause timer') + '">' + (state.timerPaused ? '&#9654;' : '&#10073;&#10073;') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="nbme-lightbox" id="nbme-lightbox"><img id="nbme-lightbox-img" src="" alt="" /></div>' +
      (state.navigatorOpen ? renderNavigatorOverlay() : '');

    if(!item.submitted){
      root.querySelectorAll('.nbme-choice').forEach(function(el){
        el.addEventListener('click', function(){
          var letter = el.getAttribute('data-choice');
          if(item.struck[letter]) return; // crossed out — must un-strike first
          item.userChoice = letter;
          render();
        });
      });
      root.querySelectorAll('.nbme-strike-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var letter = btn.getAttribute('data-strike');
          item.struck[letter] = !item.struck[letter];
          if(item.struck[letter] && item.userChoice === letter){ item.userChoice = null; }
          render();
        });
      });
      var submitBtn = document.getElementById('nbme-submit-btn');
      if(submitBtn) submitBtn.addEventListener('click', submitAnswer);
    }

    document.getElementById('nbme-prev-btn').addEventListener('click', goPrev);
    document.getElementById('nbme-bottom-next-btn').addEventListener('click', goNextItem);
    document.getElementById('nbme-mark-btn').addEventListener('click', toggleMark);
    document.getElementById('nbme-bb-mark-btn').addEventListener('click', toggleMark);
    document.getElementById('nbme-navigator-btn').addEventListener('click', toggleNavigator);
    document.getElementById('nbme-pause-btn').addEventListener('click', function(){
      state.timerPaused = !state.timerPaused;
      render();
    });

    var timerToggle = document.getElementById('nbme-timer-toggle');
    if(timerToggle) timerToggle.addEventListener('click', function(){ state.timerHidden = !state.timerHidden; render(); });

    document.getElementById('nbme-exit-btn').addEventListener('click', function(){
      var answered = state.block.some(function(it){ return it.submitted; });
      if(answered){
        if(confirm('End this block now? Unanswered questions will not be scored.')) finishBlock();
      } else if(confirm('Exit without answering any questions?')){
        stopTimer();
        state.screen = 'setup';
        render();
      }
    });

    root.querySelectorAll('[data-lightbox-src]').forEach(function(img){
      img.addEventListener('click', function(){
        var lb = document.getElementById('nbme-lightbox');
        var lbImg = document.getElementById('nbme-lightbox-img');
        lbImg.src = img.getAttribute('data-lightbox-src');
        lb.classList.add('open');
      });
    });
    var lightbox = document.getElementById('nbme-lightbox');
    if(lightbox){
      lightbox.addEventListener('click', function(){ lightbox.classList.remove('open'); });
    }

    if(state.navigatorOpen) wireNavigatorEvents();
    updateTimerDisplay();
    hideHighlightToolbar();
    var stemEl = document.getElementById('nbme-stem-el');
    if(stemEl) wireHighlightableStem(stemEl, state.index);
  }

  // ---- question navigator (jump to / review any item in the block) ----
  function renderNavigatorOverlay(){
    var answered = 0, marked = 0;
    var cells = state.block.map(function(it, i){
      if(it.submitted) answered++;
      if(it.marked) marked++;
      var cls = 'nbme-nav-cell';
      if(i === state.index) cls += ' current';
      if(it.submitted) cls += ' answered';
      return '<button type="button" class="' + cls + '" data-nav-jump="' + i + '">' + (i + 1) + (it.marked ? '<span class="flagdot"></span>' : '') + '</button>';
    }).join('');
    var unanswered = state.block.length - answered;
    return (
      '<div class="nbme-navigator-overlay" id="nbme-navigator-overlay">' +
        '<div class="nbme-navigator-panel">' +
          '<div class="nbme-navigator-head"><h2>Question Navigator</h2><button class="nbme-nav-close" id="nbme-nav-close" type="button">&times;</button></div>' +
          '<div class="nbme-nav-legend">' +
            '<span><span class="nbme-legend-dot answered"></span> Answered</span>' +
            '<span><span class="nbme-legend-dot unanswered"></span> Unanswered</span>' +
            '<span><span class="nbme-legend-dot marked"></span> Marked for review</span>' +
          '</div>' +
          '<div class="nbme-nav-grid">' + cells + '</div>' +
          '<div class="nbme-nav-footer">' +
            '<span>' + answered + ' answered &middot; ' + marked + ' marked &middot; ' + unanswered + ' unanswered</span>' +
            '<button class="nbme-btn nbme-btn-primary" id="nbme-nav-end-block" type="button">End Block Now</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  function wireNavigatorEvents(){
    var overlay = document.getElementById('nbme-navigator-overlay');
    if(!overlay) return;
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ state.navigatorOpen = false; render(); }
    });
    document.getElementById('nbme-nav-close').addEventListener('click', function(){ state.navigatorOpen = false; render(); });
    root.querySelectorAll('[data-nav-jump]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.index = parseInt(btn.getAttribute('data-nav-jump'), 10);
        state.navigatorOpen = false;
        render();
      });
    });
    document.getElementById('nbme-nav-end-block').addEventListener('click', function(){
      if(confirm('End this block now? Unanswered questions will not be scored.')) finishBlock();
    });
  }
  function toggleNavigator(){ state.navigatorOpen = !state.navigatorOpen; render(); }
  function toggleMark(){ state.block[state.index].marked = !state.block[state.index].marked; render(); }
  function goPrev(){ if(state.index > 0){ state.index--; render(); } }
  function goNextItem(){
    if(state.index < state.block.length - 1){ state.index++; render(); }
    else { finishBlock(); }
  }

  function submitAnswer(){
    var item = state.block[state.index];
    if(!item.userChoice || item.submitted) return;
    item.submitted = true;
    item.timeSpentMs = Date.now() - (item.startedAt || Date.now());
    var correct = item.userChoice === item.source.answer;

    recordAnswer(stats, item.source.tag, correct);
    saveStats(stats);

    render();
  }

  function finishBlock(){
    stopTimer();
    var submittedItems = state.block.filter(function(it){ return it.submitted; });
    var correctCount = submittedItems.filter(function(it){ return it.userChoice === it.source.answer; }).length;
    recordAttempt(stats, correctCount, submittedItems.length);
    saveStats(stats);
    state.screen = 'results';
    state.navigatorOpen = false;
    render();
  }

  // ================= RESULTS SCREEN =================
  function renderResults(){
    var submittedItems = state.block.filter(function(it){ return it.submitted; });
    var total = submittedItems.length;
    var correct = submittedItems.filter(function(it){ return it.userChoice === it.source.answer; }).length;
    var pct = total ? Math.round((correct/total)*100) : 0;
    var pctCls = pctClass(pct);
    var skipped = state.block.length - total;

    var byTag = {};
    submittedItems.forEach(function(it){
      var t = it.source.tag;
      if(!byTag[t]) byTag[t] = { correct:0, total:0 };
      byTag[t].total++;
      if(it.userChoice === it.source.answer) byTag[t].correct++;
    });
    var tagRows = Object.keys(byTag).map(function(t){
      var d = byTag[t];
      var p = Math.round((d.correct/d.total)*100);
      return { tag:t, pct:p, correct:d.correct, total:d.total };
    }).sort(function(a,b){ return a.pct - b.pct; });

    var weakest = tagRows[0];

    var breakdownHtml = tagRows.map(function(r){
      return (
        '<div class="nbme-break-row">' +
          '<span class="label">' + esc(r.tag) + '</span>' +
          '<span class="bar-track"><span class="bar-fill ' + pctClass(r.pct) + '" style="width:' + r.pct + '%"></span></span>' +
          '<span class="pct">' + r.correct + '/' + r.total + ' &middot; ' + r.pct + '%</span>' +
        '</div>'
      );
    }).join('');

    var missedItems = submittedItems.filter(function(it){ return it.userChoice !== it.source.answer; });

    var reviewHtml = state.block.map(function(it, i){
      var q = it.source;
      var stemLine = q.stem.length > 90 ? q.stem.slice(0, 90) + '…' : q.stem;
      var statusLabel, statusCls;
      if(!it.submitted){ statusLabel = 'Skipped'; statusCls = 'wrong'; }
      else if(it.userChoice === q.answer){ statusLabel = '✓ Correct'; statusCls = ''; }
      else { statusLabel = '✗ Missed'; statusCls = 'wrong'; }

      var detailHtml;
      if(it.submitted){
        var yourDisplay = displayLetterOf(it, it.userChoice);
        var correctDisplay = displayLetterOf(it, q.answer);
        var isCorrect = it.userChoice === q.answer;
        detailHtml =
          '<div>Your answer: <b class="' + (isCorrect ? 'correct-ans' : 'your-ans') + '">' + yourDisplay + '. ' + esc(q.options[it.userChoice]) + '</b></div>' +
          (isCorrect ? '' : '<div>Correct answer: <b class="correct-ans">' + correctDisplay + '. ' + esc(q.options[q.answer]) + '</b></div>') +
          '<div class="explanation">' + esc(q.explanation) + '</div>';
      } else {
        detailHtml =
          '<div>This question was not answered.</div>' +
          '<div>Correct answer: <b class="correct-ans">' + displayLetterOf(it, q.answer) + '. ' + esc(q.options[q.answer]) + '</b></div>' +
          '<div class="explanation">' + esc(q.explanation) + '</div>';
      }

      return (
        '<div class="nbme-review-item" data-review-idx="' + i + '">' +
          '<div class="nbme-review-summary" data-review-toggle="' + i + '">' +
            '<span class="idx">' + (i+1) + '.</span>' +
            '<span class="stemline">' + esc(stemLine) + '</span>' +
            (it.marked ? '<span class="status" style="color:var(--nbme-amber)" title="Marked for review">&#9873;</span>' : '') +
            '<span class="status ' + statusCls + '">' + statusLabel + '</span>' +
          '</div>' +
          '<div class="nbme-review-detail">' + detailHtml + '</div>' +
        '</div>'
      );
    }).join('');

    root.innerHTML =
      '<div class="nbme-shell">' +
        '<div class="nbme-topbar">' +
          '<div class="nbme-brand"><span class="dot"></span> ' + esc(DATA.setTitle || 'Practice') + '</div>' +
          '<div class="nbme-meta">Block Complete</div>' +
          '<div class="nbme-spacer"></div>' +
          BACK_LINK_HTML +
        '</div>' +
        '<div class="nbme-body">' +
          '<div class="nbme-results-head">' +
            '<h1>Block Results</h1>' +
            '<div class="nbme-score-big ' + pctCls + '">' + pct + '%</div>' +
            '<div class="sub">' + correct + ' of ' + total + ' correct' + (skipped ? ' &middot; ' + skipped + ' skipped' : '') + '</div>' +
          '</div>' +

          (weakest ? '<div class="nbme-callout">Weakest area this block: <b>' + esc(weakest.tag) + '</b> (' + weakest.correct + '/' + weakest.total + ', ' + weakest.pct + '%). Consider a focused review block on this topic.</div>' : '') +

          '<div class="nbme-section-label">Breakdown by topic</div>' +
          '<div class="nbme-breakdown">' + breakdownHtml + '</div>' +

          '<div class="nbme-section-label">Review (' + state.block.length + ' items)</div>' +
          '<div id="nbme-review-list">' + reviewHtml + '</div>' +

          '<div class="nbme-results-actions">' +
            (missedItems.length ? '<button class="nbme-btn nbme-btn-primary" id="nbme-retake-missed">Retake ' + missedItems.length + ' Missed Question' + (missedItems.length===1?'':'s') + '</button>' : '') +
            '<button class="nbme-btn nbme-btn-secondary" id="nbme-new-block">New Block</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    root.querySelectorAll('[data-review-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        el.closest('.nbme-review-item').classList.toggle('open');
      });
    });

    var retakeBtn = document.getElementById('nbme-retake-missed');
    if(retakeBtn){
      retakeBtn.addEventListener('click', function(){
        var ids = missedItems.map(function(it){ return it.source.id; });
        startBlock(ids);
      });
    }
    document.getElementById('nbme-new-block').addEventListener('click', function(){
      state.screen = 'setup';
      render();
    });
  }

  render();
})();
</script>
