<header class="site-header" id="site-header" role="banner">
  <div class="header-inner">
    <div class="brand-block">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="brand-kicker">AI &times; Virology &middot; Field Notes</span>
    </div>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    {% assign home_path = '/' | relative_url %}
    {% if page.url == '/' %}
      {% assign nav_base = '' %}
    {% else %}
      {% assign nav_base = home_path %}
    {% endif %}
    <nav class="site-nav" id="primary-navigation" aria-label="Primary navigation">
      <ul class="nav-list">
        <li class="nav-item"><a class="nav-link" href="{{ nav_base }}#home" data-nav-section="home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ nav_base }}#projects" data-nav-section="projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ '/blog/' | relative_url }}">Writing</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ '/what_im_reading.html' | relative_url }}">Reading</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ nav_base }}#contact" data-nav-section="contact">Contact</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>
